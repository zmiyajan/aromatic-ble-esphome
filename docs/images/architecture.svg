<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" font-family="ui-monospace, Menlo, Consolas, monospace" viewBox="0 0 820 250" role="img" aria-label="مخطط: Home Assistant وصفحة الويب يتصلون بالشريحة عبر الواي فاي، والشريحة تتصل بالمعطر عبر البلوتوث وتقرا حساس النور">
