<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" font-family="ui-monospace, Menlo, Consolas, monospace" viewBox="0 0 640 210" role="img" aria-label="منطق الكومبو: إذا كان الوقت داخل جدول مفعّل والغرفة منوّرة، المعطر يرش 10 ثواني كل 5 دقايق؛ وإلا يتوقف">
  <rect width="100%" height="100%" fill="#ffffff"/>
