      <text x="125" y="51" text-anchor="middle" font-size="13" fill="#17232e" font-weight="600">Schedule slot active?</text>
      <text x="125" y="72" text-anchor="middle" font-size="11" fill="#5a6875">00:00–23:59 · every day</text>
      <rect x="20" y="124" width="210" height="62" rx="8" fill="#eef1f3" stroke="#d3dae0"/>
      <text x="125" y="151" text-anchor="middle" font-size="13" fill="#17232e" font-weight="600">Room lit?</text>
