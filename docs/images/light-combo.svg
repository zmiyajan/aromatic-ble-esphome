      <rect x="412" y="62" width="208" height="86" rx="8" fill="#1f5d4a"/>
      <text x="516" y="94" text-anchor="middle" font-size="14" fill="#e6f2ec" font-weight="600">Spray</text>
      <text x="516" y="116" text-anchor="middle" font-size="12" fill="#e6f2ec">10 s every 5 min</text>
      <text x="516" y="136" text-anchor="middle" font-size="11" fill="#e6f2ec" opacity="0.85">else: master off</text>
